# Weekly pull requests for dependency updates, security fixes included.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      # Its packages require each other's exact version: update them in one pull request.
      react-router:
        patterns: ["react-router", "react-router-dom", "@react-router/*"]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
