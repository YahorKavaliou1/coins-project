services:
  postgres:
    image: postgres:16
    container_name: coins_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: coins_user
      POSTGRES_PASSWORD: coins_pass
      POSTGRES_DB: coins_db
    ports:
      # Only reachable from this machine, not from the local network.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coins_user -d coins_db"]
      interval: 2s
      timeout: 3s
      retries: 10

  # Local mail catcher for development: every email the site sends shows up at
  # http://localhost:8025 and nothing reaches real inboxes.
  mailpit:
    # A fixed version: "latest" would silently change what runs.
    image: axllent/mailpit:v1.31.3
    container_name: coins_mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # web UI

volumes:
  pgdata:
