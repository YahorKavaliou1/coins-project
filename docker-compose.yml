services:
  postgres:
    image: postgres:16
    container_name: coins_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: coins_user
      POSTGRES_PASSWORD: coins_pass
      POSTGRES_DB: coins_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
